name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # run all tests so we see which gem/ruby combinations break
      matrix:
        ruby: ['3.2', '3.3', '3.4', head, jruby-head]
        os: [ubuntu-latest, windows-latest]
        task: [spec]
        include:
          - ruby: '3.2' # lowest supported version, same as gemspec and .rubocop.yml
            os: ubuntu-latest
            task: rubocop
          # frozen bundler-cache install fails on jruby-head windows with "lockfile needs to be updated"
          # even though a non-frozen install changes nothing, so install without caching instead
          - ruby: jruby-head
            os: windows-latest
            task: spec
            no_cache: true
    steps:
    - uses: actions/checkout@master
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: ${{ !matrix.no_cache }} # runs 'bundle install' and caches installed gems automatically
    - if: matrix.no_cache
      run: bundle install
    - name: rake ${{ matrix.task }}
      # allow ruby/jruby-head to fail since they are moving targets
      # TODO: this will always show green, fix once https://github.com/actions/toolkit/issues/399 is resolved
      continue-on-error: ${{ endsWith(matrix.ruby, 'head') }}
      run: bundle exec rake ${{ matrix.task }}
